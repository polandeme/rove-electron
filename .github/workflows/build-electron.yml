name: Build Patched Electron (TLS Trust Anchor IDs)

on:
  push:
    branches:
      - main
    paths:
      - 'patches/**'
      - '.github/workflows/build-electron.yml'
      - '.github/scripts/build-stage.sh'
  workflow_dispatch:
    inputs:
      electron_version:
        description: Electron tag version (without leading v)
        required: true
        default: '45.3.4'
      target_arch:
        description: macOS target CPU architecture
        required: true
        type: choice
        default: arm64
        options:
          - arm64
          - x64

permissions:
  contents: write

concurrency:
  group: build-electron-${{ inputs.electron_version || '45.3.4' }}-${{ inputs.target_arch || 'arm64' }}
  cancel-in-progress: false

env:
  ELECTRON_VERSION: ${{ inputs.electron_version || '45.3.4' }}
  TARGET_ARCH: ${{ inputs.target_arch || 'arm64' }}
  DEPOT_TOOLS_UPDATE: '0'
  CCACHE_DIR: /Users/runner/.ccache
  CCACHE_MAXSIZE: 9G
  CCACHE_COMPRESS: 'true'
  CCACHE_COMPRESSLEVEL: '3'
  CCACHE_CPP2: 'yes'
  CCACHE_COMPILERCHECK: content
  CCACHE_NOHASHDIR: 'true'
  CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime,pch_defines,file_macro

jobs:
  build-stage-1:
    runs-on: macos-26
    timeout-minutes: 360
    outputs:
      finished: ${{ steps.build.outputs.finished }}
    steps:
      - uses: actions/checkout@v4
      - name: Initialize environment and ccache
        run: |
          echo "WORK_DIR=${RUNNER_TEMP}/electron-build" >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=${RUNNER_TEMP}/electron-build/src" >> "$GITHUB_ENV"
          brew install ccache
          mkdir -p "$CCACHE_DIR"
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: /Users/runner/.ccache
          key: ccache-c2-v${{ env.ELECTRON_VERSION }}-${{ env.TARGET_ARCH }}-${{ github.run_id }}-s1
          restore-keys: |
            ccache-c2-v${{ env.ELECTRON_VERSION }}-${{ env.TARGET_ARCH }}-
      - name: Run Stage 1
        id: build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/build-stage.sh stage-1 250
      - name: Upload failure log
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f "$WORK_DIR/last-step.log" ]; then
            tail -n 200 "$WORK_DIR/last-step.log" > "$WORK_DIR/failure-tail.txt"
            gh release upload ci-debug-log "$WORK_DIR/failure-tail.txt" --clobber || gh release create ci-debug-log "$WORK_DIR/failure-tail.txt" --prerelease --title "CI Debug Log" --notes "Failure tail" || true
          fi
      - name: Free build tree and tidy ccache
        if: always()
        run: |
          rm -rf "$WORK_DIR/src" "$WORK_DIR/verify"
          find "$CCACHE_DIR" -name "*.tmp.*" -delete 2>/dev/null || true
          ccache -c || true
          du -sh "$CCACHE_DIR" || true
          df -h
      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /Users/runner/.ccache
          key: ccache-c2-v${{ env.ELECTRON_VERSION }}-${{ env.TARGET_ARCH }}-${{ github.run_id }}-s1

  build-stage-2:
    needs: build-stage-1
    if: needs.build-stage-1.outputs.finished != 'true'
    runs-on: macos-26
    timeout-minutes: 360
    outputs:
      finished: ${{ steps.build.outputs.finished }}
    steps:
      - uses: actions/checkout@v4
      - name: Initialize environment and ccache
        run: |
          echo "WORK_DIR=${RUNNER_TEMP}/electron-build" >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=${RUNNER_TEMP}/electron-build/src" >> "$GITHUB_ENV"
          brew install ccache
          mkdir -p "$CCACHE_DIR"
      - name: Restore ccache from Stage 1
        uses: actions/cache/restore@v4
        with:
          path: /Users/runner/.ccache
          key: ccache-c2-v${{ env.ELECTRON_VERSION }}-${{ env.TARGET_ARCH }}-${{ github.run_id }}-s1
          restore-keys: |
            ccache-c2-v${{ env.ELECTRON_VERSION }}-${{ env.TARGET_ARCH }}-
      - name: Run Stage 2
        id: build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/build-stage.sh stage-2 250
      - name: Upload failure log
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f "$WORK_DIR/last-step.log" ]; then
            tail -n 200 "$WORK_DIR/last-step.log" > "$WORK_DIR/failure-tail.txt"
            gh release upload ci-debug-log "$WORK_DIR/failure-tail.txt" --clobber || true
          fi
      - name: Free build tree and tidy ccache
        if: always()
        run: |
          rm -rf "$WORK_DIR/src" "$WORK_DIR/verify"
          find "$CCACHE_DIR" -name "*.tmp.*" -delete 2>/dev/null || true
          ccache -c || true
          du -sh "$CCACHE_DIR" || true
          df -h
      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /Users/runner/.ccache
          key: ccache-c2-v${{ env.ELECTRON_VERSION }}-${{ env.TARGET_ARCH }}-${{ github.run_id }}-s2

  build-stage-3:
    needs: [build-stage-1, build-stage-2]
    if: always() && needs.build-stage-1.result == 'success' && needs.build-stage-1.outputs.finished != 'true' && needs.build-stage-2.result == 'success' && needs.build-stage-2.outputs.finished != 'true'
    runs-on: macos-26
    timeout-minutes: 360
    outputs:
      finished: ${{ steps.build.outputs.finished }}
    steps:
      - uses: actions/checkout@v4
      - name: Initialize environment and ccache
        run: |
          echo "WORK_DIR=${RUNNER_TEMP}/electron-build" >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=${RUNNER_TEMP}/electron-build/src" >> "$GITHUB_ENV"
          brew install ccache
          mkdir -p "$CCACHE_DIR"
      - name: Restore ccache from Stage 2
        uses: actions/cache/restore@v4
        with:
          path: /Users/runner/.ccache
          key: ccache-c2-v${{ env.ELECTRON_VERSION }}-${{ env.TARGET_ARCH }}-${{ github.run_id }}-s2
          restore-keys: |
            ccache-c2-v${{ env.ELECTRON_VERSION }}-${{ env.TARGET_ARCH }}-
      - name: Run Stage 3
        id: build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/build-stage.sh stage-3 250
      - name: Upload failure log
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f "$WORK_DIR/last-step.log" ]; then
            tail -n 200 "$WORK_DIR/last-step.log" > "$WORK_DIR/failure-tail.txt"
            gh release upload ci-debug-log "$WORK_DIR/failure-tail.txt" --clobber || true
          fi
      - name: Free build tree and tidy ccache
        if: always()
        run: |
          rm -rf "$WORK_DIR/src" "$WORK_DIR/verify"
          find "$CCACHE_DIR" -name "*.tmp.*" -delete 2>/dev/null || true
          ccache -c || true
          du -sh "$CCACHE_DIR" || true
          df -h
      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /Users/runner/.ccache
          key: ccache-c2-v${{ env.ELECTRON_VERSION }}-${{ env.TARGET_ARCH }}-${{ github.run_id }}-s3

  build-stage-4:
    needs: [build-stage-1, build-stage-2, build-stage-3]
    if: always() && needs.build-stage-1.result == 'success' && needs.build-stage-1.outputs.finished != 'true' && needs.build-stage-2.result == 'success' && needs.build-stage-2.outputs.finished != 'true' && needs.build-stage-3.result == 'success' && needs.build-stage-3.outputs.finished != 'true'
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Initialize environment and ccache
        run: |
          echo "WORK_DIR=${RUNNER_TEMP}/electron-build" >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=${RUNNER_TEMP}/electron-build/src" >> "$GITHUB_ENV"
          brew install ccache
          mkdir -p "$CCACHE_DIR"
      - name: Restore ccache from Stage 3
        uses: actions/cache/restore@v4
        with:
          path: /Users/runner/.ccache
          key: ccache-c2-v${{ env.ELECTRON_VERSION }}-${{ env.TARGET_ARCH }}-${{ github.run_id }}-s3
          restore-keys: |
            ccache-c2-v${{ env.ELECTRON_VERSION }}-${{ env.TARGET_ARCH }}-
      - name: Run Stage 4
        id: build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/build-stage.sh stage-4 270
      - name: Upload failure log
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f "$WORK_DIR/last-step.log" ]; then
            tail -n 200 "$WORK_DIR/last-step.log" > "$WORK_DIR/failure-tail.txt"
            gh release upload ci-debug-log "$WORK_DIR/failure-tail.txt" --clobber || true
          fi
      - name: Free build tree and tidy ccache
        if: always()
        run: |
          rm -rf "$WORK_DIR/src" "$WORK_DIR/verify"
          find "$CCACHE_DIR" -name "*.tmp.*" -delete 2>/dev/null || true
          ccache -c || true
          du -sh "$CCACHE_DIR" || true
          df -h
      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /Users/runner/.ccache
          key: ccache-c2-v${{ env.ELECTRON_VERSION }}-${{ env.TARGET_ARCH }}-${{ github.run_id }}-s4
